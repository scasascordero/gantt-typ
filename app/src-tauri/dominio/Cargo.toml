[package]
name = "dominio"
version = "0.1.0"
edition = "2021"
description = "Modelo de dominio del cronograma: SQLite persistencia + petgraph CPM en memoria"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
petgraph = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
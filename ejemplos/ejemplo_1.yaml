# Proyecto: construcción de centro de distribución — 32 actividades, 4 niveles.
# Las tareas de la estructura de hormigón (3.3.1 y 3.3.2) muestran el módulo
# de análisis de precios unitarios: `recursos` con cantidad, precio y
# rendimiento; el costo-unitario se calcula automáticamente y las columnas
# "C. unitario" y "Costo" lo exponen en la carta.
# Los campos `cantidad` y `rendimiento` aceptan fórmulas aritméticas
# (p. ej. "0.04*2", "160*2", "6/3"): se evalúan antes de calcular las cuotas.
config:
  titulo: "Centro de distribución — con análisis de precios unitarios (APU)"
  mostrar-columnas: [duracion, costo-unitario, costo]
tareas:
  - codigo: "0"
    nombre: Proyecto centro de distribución
    subtareas:
      - codigo: "1"
        nombre: Planificación
        subtareas:
          - codigo: "1.1"
            nombre: Estudio de factibilidad
            inicio: 2026-01-05
            duracion: 20
            avance: 1.0
          - codigo: "1.2"
            nombre: Diseño conceptual
            subtareas:
              - codigo: "1.2.1"
                nombre: Anteproyecto
                inicio: 2026-01-25
                duracion: 25
                avance: ["50%", "40%"]
              - codigo: "1.2.2"
                nombre: Ajustes al anteproyecto
                inicio: 2026-02-19
                duracion: 10
                avance: 0.5
          - codigo: "1.3"
            nombre: Diseño de detalle
            subtareas:
              - codigo: "1.3.1"
                nombre: Cálculo estructural
                inicio: 2026-03-01
                duracion: 30
                avance: 100
              - codigo: "1.3.2"
                nombre: Instalaciones eléctricas
                inicio: 2026-03-05
                duracion: 25
                avance: 0.8
              - codigo: "1.3.3"
                nombre: Instalaciones sanitarias
                inicio: 2026-03-05
                duracion: 25
                avance: 0.7
              - codigo: "1.3.4"
                nombre: Revisión y consolidado
                inicio: 2026-04-01
                duracion: 10
                avance: 0.2

      - codigo: "2"
        nombre: Permisos y compras
        subtareas:
          - codigo: "2.1"
            nombre: Permiso de edificación
            inicio: 2026-03-15
            duracion: 45
            avance: [0.2, 0.25, 0.15]
          - codigo: "2.2"
            nombre: Licitación del contratista
            inicio: 2026-04-05
            duracion: 30
            avance: 0.9
          - codigo: "2.3"
            nombre: "Hito: contrato firmado"
            inicio: 2026-05-05
          - codigo: "2.4"
            nombre: Equipos de larga entrega
            inicio: 2026-05-10
            duracion: 60
            avance: 0.4

      - codigo: "3"
        nombre: Construcción
        subtareas:
          - codigo: "3.1"
            nombre: Movimientos de tierra
            inicio: 2026-05-15
            duracion: 20
            avance: 1.0
          - codigo: "3.2"
            nombre: Cimentación
            inicio: 2026-06-04
            duracion: 30
            avance: 0.6
          - codigo: "3.3"
            nombre: Estructura de hormigón
            subtareas:
              - codigo: "3.3.1"
                nombre: Columnas y zapatas
                inicio: 2026-07-04
                duracion: 25
                avance: 0.5
                unidad: m3
                cantidad: 180
                # APU de ejemplo: el costo-unitario sale de las cuotas de los
                # recursos (cantidad x precio / rendimiento).
                recursos:
                  - tipo: mano-obra
                    nombre: Armador de fierro (jornada)
                    cantidad: 0.35
                    rendimiento: 1
                    precio: 62000
                  - tipo: mano-obra
                    nombre: Maestro (jornada)
                    cantidad: 0.15
                    rendimiento: 1
                    precio: 78000
                  - tipo: mano-obra
                    nombre: Ayudante (jornada)
                    cantidad: 0.4
                    rendimiento: 1
                    precio: 36000
                  - tipo: material
                    nombre: Hormigón H-35 (m3)
                    cantidad: 1.05
                    rendimiento: 1
                    precio: 95000
                  - tipo: material
                    nombre: Fierro de refuerzo (kg)
                    cantidad: 95
                    rendimiento: 1
                    precio: 1350
                  - tipo: material
                    nombre: Moldaje de madera (m2)
                    cantidad: 6
                    rendimiento: 1
                    precio: 4200
                  - tipo: equipo
                    nombre: Grúa autocargante (hora)
                    cantidad: "0.04*2"
                    rendimiento: "2/2"
                    precio: 72000
                  - tipo: equipo
                    nombre: Vibrador de inmersión (hora)
                    cantidad: "1/10"
                    rendimiento: 1
                    precio: 9500
              - codigo: "3.3.2"
                nombre: Losas y vigas
                inicio: 2026-07-29
                duracion: 35
                avance: 0.1
                unidad: m3
                cantidad: "160*2"
                # Los valores siguen siendo los mismos: 320 m3, con fórmulas
                # en cantidad y en el rendimiento de algunos recursos.
                recursos:
                  - tipo: mano-obra
                    nombre: Maestro (jornada)
                    cantidad: 0.12
                    rendimiento: 1
                    precio: 78000
                  - tipo: mano-obra
                    nombre: Armador de fierro (jornada)
                    cantidad: 0.28
                    rendimiento: 1
                    precio: 62000
                  - tipo: mano-obra
                    nombre: Carpintero de moldajes (jornada)
                    cantidad: 0.1
                    rendimiento: 1
                    precio: 65000
                  - tipo: mano-obra
                    nombre: Ayudante (jornada)
                    cantidad: 0.35
                    rendimiento: 1
                    precio: 36000
                  - tipo: material
                    nombre: Hormigón H-35 (m3)
                    cantidad: 1.06
                    rendimiento: 1
                    precio: 95000
                  - tipo: material
                    nombre: Fierro de refuerzo (kg)
                    cantidad: 88
                    rendimiento: 1
                    precio: 1350
                  - tipo: material
                    nombre: Moldaje metálico (m2)
                    cantidad: 2.8
                    rendimiento: 1
                    precio: 6800
                  - tipo: equipo
                    nombre: Bomba de hormigón (hora)
                    cantidad: "1/20"
                    rendimiento: 1
                    precio: 118000
                  - tipo: equipo
                    nombre: Vibrador de inmersión (hora)
                    cantidad: 0.1
                    rendimiento: 1
                    precio: 9500
          - codigo: "3.4"
            nombre: Cerramientos y cubierta
            inicio: 2026-09-02
            duracion: 30
            avance: 0
          - codigo: "3.5"
            nombre: Instalaciones interiores
            subtareas:
              - codigo: "3.5.1"
                nombre: Eléctricas e iluminación
                inicio: 2026-09-25
                duracion: 30
                avance: 0
              - codigo: "3.5.2"
                nombre: Sanitarias y contra incendios
                inicio: 2026-09-25
                duracion: 30
                avance: 0
              - codigo: "3.5.3"
                nombre: Climatización (HVAC)
                inicio: 2026-10-05
                duracion: 35
                avance: 0
          - codigo: "3.6"
            nombre: Terminaciones y pintura
            inicio: 2026-11-05
            duracion: 25
            avance: 0

      - codigo: "4"
        nombre: Puesta en marcha
        subtareas:
          - codigo: "4.1"
            nombre: Pruebas técnicas y comisionado
            inicio: 2026-12-01
            duracion: 15
            avance: 0
          - codigo: "4.2"
            nombre: Capacitación del personal
            inicio: 2026-12-10
            duracion: 10
            avance: 0
          - codigo: "4.3"
            nombre: "Hito: recepción final"
            inicio: 2026-12-20